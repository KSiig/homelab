apiVersion: batch/v1
kind: CronJob
metadata:
  name: tilbudstracker
  namespace: tilbudstracker
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: tilbudstracker
              image: ksiig/tilbudstracker:latest
              volumeMounts:
                - name: data
                  mountPath: /app/data
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tilbudstracker-data
