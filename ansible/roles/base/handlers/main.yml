---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Enable zram-swap
  ansible.builtin.systemd:
    name: zram-swap
    enabled: true
    state: started
    daemon_reload: true
