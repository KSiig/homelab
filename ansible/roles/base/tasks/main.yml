---
- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - git
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - ufw
    state: present

- name: Set timezone
  community.general.timezone:
    name: Europe/Copenhagen

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 5
      bantime = 3600
    mode: "0644"
  notify: Restart fail2ban

- name: Disable password authentication for SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Disable file swap
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Install zram-config
  ansible.builtin.apt:
    name: linux-modules-extra-raspi
    state: present

- name: Load zram module
  community.general.modprobe:
    name: zram
    state: present

- name: Configure zram swap
  ansible.builtin.copy:
    dest: /etc/systemd/system/zram-swap.service
    content: |
      [Unit]
      Description=Configure zram swap
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'echo lz4 > /sys/block/zram0/comp_algorithm && echo 256M > /sys/block/zram0/disksize && mkswap /dev/zram0 && swapon -p 100 /dev/zram0'
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Enable zram-swap

- name: Configure UFW defaults
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

handlers:
  - name: Restart fail2ban
    ansible.builtin.service:
      name: fail2ban
      state: restarted

  - name: Restart sshd
    ansible.builtin.service:
      name: sshd
      state: restarted

  - name: Enable zram-swap
    ansible.builtin.systemd:
      name: zram-swap
      enabled: true
      state: started
      daemon_reload: true
