---
- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - git
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - ufw
      - qrencode
      - wireguard-tools
    state: present

- name: Set timezone
  community.general.timezone:
    name: Europe/Copenhagen

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 2222
      filter = sshd
      maxretry = 3
      bantime = 3600
    mode: "0644"
  notify: Restart fail2ban

- name: Disable password authentication for SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Set SSH port to 2222
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Port "
    line: "Port 2222"
  notify: Restart sshd

- name: Disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart sshd

- name: Disable file swap
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Load zram module
  community.general.modprobe:
    name: zram
    state: present

- name: Configure zram swap
  ansible.builtin.copy:
    dest: /etc/systemd/system/zram-swap.service
    content: |
      [Unit]
      Description=Configure zram swap
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'echo lz4 > /sys/block/zram0/comp_algorithm && echo 256M > /sys/block/zram0/disksize && mkswap /dev/zram0 && swapon -p 100 /dev/zram0'
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Enable zram-swap

- name: Set swappiness to 10
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
    reload: true

# WireGuard 51820/udp will be allowed by the wireguard role
- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "2222"
    proto: tcp

- name: Configure UFW defaults
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Configure static IP via netplan
  ansible.builtin.copy:
    dest: /etc/netplan/01-static.yaml
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: false
            addresses:
              - 192.168.1.142/24
            routes:
              - to: default
                via: 192.168.1.1
            nameservers:
              addresses:
                - 1.1.1.1
                - 1.0.0.1
    mode: "0600"
  notify: Apply netplan

- name: Enable cgroup memory in boot config
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: true
    regexp: '^((?!.*cgroup_memory=1).*)$'
    line: '\1 cgroup_memory=1 cgroup_enable=memory'
  notify: Reboot required
