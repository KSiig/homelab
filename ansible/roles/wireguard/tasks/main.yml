---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: Check if WireGuard private key exists
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: wg_private_key

- name: Generate WireGuard private key
  when: not wg_private_key.stat.exists
  ansible.builtin.shell: wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key

- name: Set private key permissions
  ansible.builtin.file:
    path: /etc/wireguard/private.key
    mode: "0600"

- name: Read private key
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key_content

- name: Generate public key
  ansible.builtin.shell: cat /etc/wireguard/private.key | wg pubkey
  register: wg_public_key
  changed_when: false

- name: Save public key
  ansible.builtin.copy:
    content: "{{ wg_public_key.stdout }}\n"
    dest: /etc/wireguard/public.key
    mode: "0644"

- name: Configure WireGuard interface
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart WireGuard

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    reload: true

- name: Allow WireGuard through UFW
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Display WireGuard public key
  ansible.builtin.debug:
    msg: "WireGuard public key: {{ wg_public_key.stdout }}"
