---
- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Create K3s database directory
  ansible.builtin.file:
    path: /mnt/data/rancher/k3s/server/db
    state: directory
    mode: "0700"

- name: Install K3s (without starting)
  when: not k3s_binary.stat.exists
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_SKIP_START=true \
      INSTALL_K3S_EXEC="--data-dir /mnt/data/rancher/k3s --write-kubeconfig-mode 644 --datastore-endpoint sqlite:///mnt/data/rancher/k3s/server/db/state.db?_journal=WAL&_synchronous=NORMAL" \
      sh -s -
  args:
    creates: /usr/local/bin/k3s

- name: Allow K3s API server through UFW
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

- name: Ensure K3s service is enabled and running
  ansible.builtin.shell: systemctl enable k3s && systemctl start k3s &
  changed_when: true

- name: Wait for K3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  retries: 60
  delay: 10
  until: k3s_nodes.rc == 0
  changed_when: false

- name: Fetch kubeconfig from Pi
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s-kubeconfig.yaml
    flat: true
