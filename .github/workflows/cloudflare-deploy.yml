# Reusable Cloudflare deploy workflow.
# Call from another repo:
#   jobs:
#     deploy:
#       uses: KSiig/homelab/.github/workflows/cloudflare-deploy.yml@main
#       with:
#         working_directory: web
#         command: pages deploy ./dist
#         cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
#       secrets:
#         cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#
# Note for pnpm consumers: wrangler-action@v3 auto-detects the package manager
# from lockfiles (pnpm-lock.yaml -> pnpm). If your consumer repo uses pnpm,
# add a pnpm setup step (e.g. pnpm/action-setup) at the job level before this
# workflow runs, otherwise the wrangler install step fails on ubuntu-latest.

name: Cloudflare Deploy

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory to run wrangler from."
        type: string
        default: "cloudflare"
      command:
        description: "wrangler subcommand (default: deploy)."
        type: string
        default: "deploy"
      node_version:
        description: "Node.js version."
        type: string
        default: "22"
      cloudflare_account_id:
        description: "Cloudflare account ID. Falls back to CLOUDFLARE_ACCOUNT_ID env or wrangler.toml."
        type: string
        required: false
        default: ""
    secrets:
      cloudflare_api_token:
        description: "Cloudflare API token."
        required: true
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Directory to run wrangler from."
        type: string
        default: "cloudflare"
      command:
        description: "wrangler subcommand."
        type: string
        default: "deploy"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reusable deploy entry point. workflow_call consumers (e.g. SII-101
  # priskurven Worker) use this with `command: deploy`. Not run on push
  # because homelab has no Worker `main`; pushes apply D1 migrations instead.
  deploy:
    name: Deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          accountId: ${{ inputs.cloudflare_account_id }}
          workingDirectory: ${{ inputs.working_directory }}
          command: ${{ inputs.command }}

  # On push under cloudflare/**, apply every bound D1 database's migrations
  # remotely. Replaces the previous "wrangler deploy" push behaviour, which
  # failed because homelab has no Worker `main`.
  d1-migrations:
    name: Apply D1 migrations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # cloudflare/wrangler.toml on main keeps the PRISKURVEN binding's
      # database_id as a placeholder UUID (SII-109). wrangler resolves the
      # binding by database_id, so the placeholder would target an invalid
      # database. Look up the real ID via the Cloudflare API (the same
      # source of truth as the SII-91 Terraform output) and patch the
      # placeholder in-place before wrangler reads the file.
      - name: Resolve priskurven D1 database id
        id: d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=priskurven")
          DB_ID=$(echo "$RESP" | jq -r '.result[] | select(.name=="priskurven") | .uuid')
          if [ -z "${DB_ID:-}" ] || [ "${DB_ID}" = "null" ]; then
            echo "::error::priskurven D1 database not found via Cloudflare API. Has SII-91 been applied?"
            exit 1
          fi
          echo "db_id=${DB_ID}" >> "$GITHUB_OUTPUT"
          sed -i 's|"00000000-0000-0000-0000-000000000000"|"'"${DB_ID}"'"|' cloudflare/wrangler.toml

      - name: Apply priskurven D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: d1 migrations apply priskurven --remote

  validate:
    name: Validate workflow (smoke test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: --version
