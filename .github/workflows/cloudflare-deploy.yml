# Reusable Cloudflare deploy workflow (caller-only).
#
# Call from another repo:
#   jobs:
#     deploy:
#       uses: KSiig/homelab/.github/workflows/cloudflare-deploy.yml@main
#       with:
#         working_directory: web
#         command: pages deploy ./dist
#         cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
#       secrets:
#         cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#
# This workflow is caller-only: it has no `push` and no `workflow_dispatch`
# triggers, and no `if:` gate on the deploy job. The previous `push` trigger
# fired `wrangler deploy` on a homelab main that has no Worker, which failed.
# The `d1-migrations` job that previously lived here has moved to the
# homelab-only sibling workflow `cloudflare-d1-migrations.yml`, which is
# the right place for any homelab-only work.
#
# Note for pnpm consumers: wrangler-action@v3 auto-detects the package manager
# from lockfiles (pnpm-lock.yaml -> pnpm). If your consumer repo uses pnpm,
# add a pnpm setup step (e.g. pnpm/action-setup) at the job level before this
# workflow runs, otherwise the wrangler install step fails on ubuntu-latest.

name: Cloudflare Deploy

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory to run wrangler from."
        type: string
        default: "cloudflare"
      command:
        description: "wrangler subcommand (default: deploy)."
        type: string
        default: "deploy"
      node_version:
        description: "Node.js version."
        type: string
        default: "22"
      cloudflare_account_id:
        description: "Cloudflare account ID. Falls back to CLOUDFLARE_ACCOUNT_ID env or wrangler.toml."
        type: string
        required: false
        default: ""
    secrets:
      cloudflare_api_token:
        description: "Cloudflare API token."
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          accountId: ${{ inputs.cloudflare_account_id }}
          workingDirectory: ${{ inputs.working_directory }}
          command: ${{ inputs.command }}
