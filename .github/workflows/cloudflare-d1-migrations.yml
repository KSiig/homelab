# Homelab-only D1 migrations workflow.
#
# On push to main (paths cloudflare/** and this workflow file), apply every
# bound D1 database's migrations remotely. On manual dispatch, run the
# `validate` smoke test (wrangler --version) instead — migrations don't run
# on a manual dispatch.
#
# This workflow is NOT reusable. Callers of the reusable `cloudflare-deploy.yml`
# must not import it. The migrations job uses `vars.CLOUDFLARE_ACCOUNT_ID`
# (a homelab repo variable), which is empty in the caller context — that's
# exactly the failure mode that prompted the split.
#
# This file MUST NOT define `workflow_call`. The reusable workflow already
# handles caller traffic; this one handles homelab's own pushes.

name: Cloudflare D1 Migrations (homelab)

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-migrations.yml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On push under cloudflare/**, apply every bound D1 database's migrations
  # remotely. Replaces the previous "wrangler deploy" push behaviour, which
  # failed because homelab has no Worker `main`.
  d1-migrations:
    name: Apply D1 migrations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # cloudflare/wrangler.toml on main keeps the PRISKURVEN binding's
      # database_id as a placeholder UUID (SII-109). wrangler resolves the
      # binding by database_id, so the placeholder would target an invalid
      # database. Look up the real ID via the Cloudflare API (the same
      # source of truth as the SII-91 Terraform output) and patch the
      # placeholder in-place before wrangler reads the file.
      - name: Resolve priskurven D1 database id
        id: d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=priskurven")
          DB_ID=$(echo "$RESP" | jq -r '.result[] | select(.name=="priskurven") | .uuid')
          if [ -z "${DB_ID:-}" ] || [ "${DB_ID}" = "null" ]; then
            echo "::error::priskurven D1 database not found via Cloudflare API. Has SII-91 been applied?"
            exit 1
          fi
          echo "db_id=${DB_ID}" >> "$GITHUB_OUTPUT"
          sed -i 's|"00000000-0000-0000-0000-000000000000"|"'"${DB_ID}"'"|' cloudflare/wrangler.toml

      - name: Apply priskurven D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: d1 migrations apply priskurven --remote

  validate:
    name: Validate workflow (smoke test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: --version
